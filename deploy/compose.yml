# Prod compose — run from repo root: TAG=<sha> docker compose -f deploy/compose.yml up -d
# network_mode: host — uvicorn binds 127.0.0.1:3203 (loopback-only, python-api is the
# sole S2S consumer; ADR-055). Stateless: env on host, logs to host journald.
# shm_size: Chromium runs with --disable-dev-shm-usage, the 1g is belt & suspenders.
services:
  export-pdf-worker:
    image: export-pdf-worker:${TAG:?set TAG to the image tag to run}
    container_name: export-pdf-worker
    network_mode: host
    restart: unless-stopped
    shm_size: 1g
    env_file: /home/tbng84/Projects/AI-Story-Book/ai-storybook-export-pdf-worker/.env
    logging:
      driver: journald
      options:
        tag: export-pdf-worker
